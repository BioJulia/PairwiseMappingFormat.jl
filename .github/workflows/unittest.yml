name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1', '1.11']
        os: [ubuntu-latest, macOS-latest, windows-latest]
        experimental: [false]
        # Runner's native architecture. Must be a matrix key, so that the x86 entry below
        # overrides it and becomes a new job, instead of being merged into an existing job.
        arch: [default]
        include:
          # Include nightly, but experimental, so it's allowed to fail without
          # failing CI.
          - julia-version: nightly
            os: ubuntu-latest
            experimental: true
            fail_ci_if_error: false
          # 32-bit Linux (i686), which setup-julia calls x86
          - julia-version: '1'
            os: ubuntu-latest
            arch: x86
            experimental: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Setup Julia
        uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.arch || 'default' }}
      - name: Run Tests
        uses: julia-actions/julia-runtest@latest
      - name: Create CodeCov
        uses: julia-actions/julia-processcoverage@latest
      - name: Upload CodeCov
        uses: codecov/codecov-action@v4
        with:
          file: ./lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

